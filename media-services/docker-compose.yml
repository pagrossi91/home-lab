  #     - vpn

  # nzbhydra2: # Redundant with Prowlarr
  #   image: lscr.io/linuxserver/nzbhydra2:latest
  #   container_name: nzbhydra2
  #   networks:
  #     vpn:
  #       ipv4_address: ${NZBHYDRA2_STATIC_IP}
