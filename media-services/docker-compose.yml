  #   restart: unless-stopped

  recyclarr: # Sync Sonarr and Radarr to TRaSH Guide profiles
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: ${LOCAL_USER}:${LOCAL_USER}
    networks:
      - vpn 
    volumes:
      - ${APPDATA_DIR}/recyclarr:/config
    environment:
      RECYCLARR_CREATE_CONFIG: false
      TZ: ${TZ}
    depends_on:
      - sonarr
      - radarr
    restart: always

  lidarr-paul: # Music
    container_name: lidarr-paul
    image: ghcr.io/linuxserver-labs/prarr:lidarr-plugins
    hostname: lidarr-docker-paul
    restart: always
    networks:
      vpn:
        ipv4_address: ${LIDARR_PAUL_STATIC_IP}
    # network_mode: service:vpn # relies on VPN service for network config. De facto 'kill switch'
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      - ${APPDATA_DIR}/lidarr/paul:/config
      # Single mount of the whole tree, as sonarr/radarr do. Separate binds for
      # library and downloads are distinct mount points to the kernel, so
      # rename(2)/link(2) across them return EXDEV -- no atomic moves, no
      # hardlinks. One mount also makes lidarr's paths match sabnzbd's, so no
      # remote path mapping is needed.
      #   root folders:  /data/media/music/paul, /data/media/music/shared
      #   sab downloads: /data/usenet/music
      - ${ARRAY_DIR}/servarr_data/:/data
    environment:
      PUID: ${LOCAL_USER}
      PGID: ${LOCAL_USER}
      TZ: ${TZ}
    ports:
      - 8686:8686
    depends_on:
      - prowlarr
      - qbittorrent
      # - slskd

  lidarr-lisa: # Music
    container_name: lidarr-lisa
    image: ghcr.io/linuxserver-labs/prarr:lidarr-plugins
    hostname: lidarr-docker-lisa
    restart: always
    networks:
      vpn:
        ipv4_address: ${LIDARR_LISA_STATIC_IP}
    # network_mode: service:vpn # relies on VPN service for network config. De facto 'kill switch'
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      - ${APPDATA_DIR}/lidarr/lisa:/config
      - ${ARRAY_DIR}/servarr_data/:/data
    environment:
      PUID: ${LOCAL_USER}
      PGID: ${LOCAL_USER}
      TZ: ${TZ}
    ports:
      - 8687:8686
    depends_on:
      - prowlarr
      - qbittorrent
      # - slskd

  navidrome:
    container_name: navidrome
    image: deluan/navidrome:latest
  #  user: 1005:1005 #Navidrome should be run as its own user and only needs read access to its volumes
    ports:
      - 4533:4533
    restart: always
    networks:
      vpn:
        ipv4_address: ${NAVIDROME_STATIC_IP}
      nginx_network:
        ipv4_address: ${NAVIDROME_STATIC_IP_NGINX}
    environment:
      PUID: ${LOCAL_USER}
      PGID: ${LOCAL_USER}
      TZ: ${TZ}
      ND_AGENTS: lastfm,spotify
      ND_LASTFM_ENABLE: True
      ND_LASTFM_LANGUAGE: EN
      ND_LASTFM_APIKEY: ${ND_LASTFM_APIKEY}
      ND_LASTFM_SECRET: ${ND_LASTFM_SECRET}
      ND_SPOTIFY_ID: ${ND_SPOTIFY_ID}
      ND_SPOTIFY_SECRET: ${ND_SPOTIFY_SECRET}
    volumes:
      - ${APPDATA_DIR}/navidrome:/data
      - ${APPDATA_DIR}/navidrome/temp:/music #Important, see below
      # Change these volumes accordingly to something that makes sense to you.
      # Each user should have a library folder and a discover folder
      # Note the right-side paths don't stem from "/music". This is because Navidrome by default adds the "/music" path
      # to all users' libraries, and this cannot be removed. This is also why we map /music to an empty directory above.
      - ${ARRAY_DIR}/servarr_data/media/music/paul:/paul/music
      - ${ARRAY_DIR}/servarr_data/media/music/discover/paul:/paul/discover
      - ${ARRAY_DIR}/servarr_data/media/music/lisa:/lisa/music
      - ${ARRAY_DIR}/servarr_data/media/music/discover/lisa:/lisa/discover
      - ${ARRAY_DIR}/servarr_data/media/music/shared:/shared

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    network_mode: service:vpn
    # user: 910:910 # Optional, if you don't want to run as root. Don't use the same user as Navidrome.
    environment:
      PUID: ${LOCAL_USER}
      PGID: ${LOCAL_USER}
      TZ: ${TZ}
      SLSKD_USERNAME: ${SLSKD_USERNAME} # webUI username
      SLSKD_PASSWORD: ${SLSKD_PASSWORD} # webUI password
      SLSKD_REMOTE_CONFIGURATION: true
      SLSKD_REMOTE_FILE_MANAGEMENT: true
      SLSKD_SHARED_DIR: /data1;/data2;/data3 # This sets a default, but we'll add other users in the slskd config
      SLSKD_DOWNLOADS_DIR: /downloads/complete
      SLSKD_INCOMPLETE_DIR: /downloads/incomplete
      # SLSKD_UPLOAD_SPEED_LIMIT: 500
      SLSKD_UMASK: 000
      SLSKD_SLSK_USERNAME: ${SLSKD_SLSK_USERNAME} # soulseek username
      SLSKD_SLSK_PASSWORD: ${SLSKD_SLSK_PASSWORD} # soulseek password
    volumes:
      - ${APPDATA_DIR}/slskd:/app
      - ${ARRAY_DIR}/servarr_data/soulseek/downloads:/downloads
      - ${ARRAY_DIR}/servarr_data/media/music/paul:/data1 # Mount each user's library as a different directory. These are only used for uploads/shares.
      - ${ARRAY_DIR}/servarr_data/media/music/lisa:/data2
      - ${ARRAY_DIR}/servarr_data/media/music/shared:/data3
    restart: always
    depends_on:
      vpn:
        condition: service_healthy

  # soularr:
  #   image: mrusse08/soularr:latest
  #   container_name: soularr
  #   hostname: soularr
  #   networks:
  #     vpn:
  #       ipv4_address: ${SOULARR_STATIC_IP}
  #   # user: 1000:1000 # this should be set to your UID and GID, which can be determined via `id -u` and `id -g`, respectively
