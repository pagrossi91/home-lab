networks: 
  vpn: 
    name: "vpn"
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
  nginx_network:
    external: true
     
services:
  pms:
    image: plexinc/pms-docker
    container_name: plex
    hostname: plex-docker
    networks:
      - nginx_network 
    ports:
      - 32400:32400/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    environment:
      TZ: ${TZ}
      PLEX_CLAIM: ${PLEX_CLAIM}
      ADVERTISE_IP: ${ADVERTISED_IPS}
      ALLOWED_NETWORKS: ${LAN_SUBNET}
    volumes:
      - ${APPDATA_DIR}/plex/database:/config
      - ${APPDATA_DIR}/plex/transcode/temp:/transcode
      - ${ARRAY_DIR}/servarr_data/media/:/data/media/
      - ${ARRAY_DIR}/cloud_data/nextcloud/nextcloud/files/Documents/Grossi Family/Videos/:/data/homevideos
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'      # Can use more when not competing
          memory: 2G

  vpn:
    image: qmcgaw/gluetun # https://github.com/qdm12/gluetun-wiki/blob/main/setup/providers/nordvpn.md
    container_name: gluetun
    networks: 
      - vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080 # QBittorrent web port
      - 6881:6881 # QBittorrent
      - 6881:6881/udp # QBittorrent
      # - 8085:8085 # sabnzbd
      - 5030:5030 #slskd, http webport
      - 5031:5031 #slskd, https webport
      - 50300:50300 #slskd, listening for incoming connections
      # - 6789:6789 # nzbget
      # - 9696:9696 # prowlarr
      # - 7878:7878 # radarr
      # - 8989:8989 # sonarr
      # - 8686:8686 # lidarr
      # - 6767:6767 # bazarr
      # - 5055:5055 # overseerr
    volumes:
      - ${APPDATA_DIR}/gluetun:/gluetun
    environment:
      VPN_TYPE: wireguard
      VPN_SERVICE_PROVIDER: nordvpn # or protonvpn
      WIREGUARD_PRIVATE_KEY: ${Nord_PRIVATEKEY}
      SERVER_COUNTRIES: United States
      SERVER_HOSTNAMES: ${Nord_P2P_SERVERS}   
      # HTTP proxy server allows Prowlarr access to Qbittorrent from a different network (i.e. not going through the VPN)
      HTTPPROXY: on
      HTTPPROXY_LISTENING_ADDRESS: :8118
      HTTPPROXY_USERL: ${HTTPPROXY_USERL}
      HTTPPROXY_PASSWORD: ${HTTPPROXY_PASSWORD}
      HTTPPROXY_STEALTH: on
    restart: always

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    # hostname: qbittorrent-docker
    network_mode: service:vpn # relies on VPN service for network config. De facto 'kill switch' for torrenting without a VPN
    environment: 
      PUID: ${LOCAL_USER}
      PGID: ${LOCAL_USER}
      TZ: ${TZ}
      WEBUI_PORT: 8080 # The torrent service would be available at http://localhost:8080/ or anywhere inside of the local network http://192.168.1.xxx:8080
    volumes:
      - ${APPDATA_DIR}/qbittorrent/config:/config
      - ${APPDATA_DIR}/qbittorrent/torrent_files:/torrent_files/
      - ${ARRAY_DIR}/servarr_data/torrents:/data/torrents/
    depends_on:
      - vpn
    restart: always

  prowlarr: # Set trackers
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr-docker
    networks:
      vpn:
        ipv4_address: ${PROWLARR_STATIC_IP}
    # network_mode: service:vpn # relies on VPN service for network config. De facto 'kill switch'
    environment:
      PUID: ${LOCAL_USER}
      PGID: ${LOCAL_USER}
      TZ: ${TZ}
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      - ${APPDATA_DIR}/prowlarr:/config
    restart: always
    ports:
      - 9696:9696
    depends_on:
      - vpn
      - qbittorrent

  radarr: # Movies
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    hostname: radarr-docker
    restart: always
    networks:
      vpn:
        ipv4_address: ${RADARR_STATIC_IP}
    # network_mode: service:vpn # relies on VPN service for network config. De facto 'kill switch'
    logging:
      driver: json-file
    ports:
      - 7878:7878
    environment:
      PUID: ${LOCAL_USER}
      PGID: ${LOCAL_USER}
      TZ: ${TZ}
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      - ${APPDATA_DIR}/radarr:/config
      - ${ARRAY_DIR}/servarr_data/:/data
    depends_on:
      - prowlarr
      - qbittorrent

  radarr4k: # Movies
    container_name: radarr4k
    image: lscr.io/linuxserver/radarr:latest
    hostname: radarr4k-docker
    restart: always
    networks:
      vpn:
        ipv4_address: ${RADARR4K_STATIC_IP}
    # network_mode: service:vpn # relies on VPN service for network config. De facto 'kill switch'
    logging:
      driver: json-file
    ports:
      - 7879:7878
    environment:
      PUID: ${LOCAL_USER}
      PGID: ${LOCAL_USER}
      TZ: ${TZ}
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      - ${APPDATA_DIR}/radarr4k:/config
      - ${ARRAY_DIR}/servarr_data/:/data
    depends_on:
      - prowlarr
      - qbittorrent

  sonarr: # TV shows
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    hostname: sonarr-docker
    restart: always
    networks:
      vpn:
        ipv4_address: ${SONARR_STATIC_IP}
    # network_mode: service:vpn # relies on VPN service for network config. De facto 'kill switch'
    logging:
      driver: json-file
    ports:
      - 8989:8989
    environment:
      PUID: ${LOCAL_USER}
      PGID: ${LOCAL_USER}
      TZ: ${TZ}
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      - ${APPDATA_DIR}/sonarr:/config
      - ${ARRAY_DIR}/servarr_data/:/data
    depends_on:
      - prowlarr
      - qbittorrent

  sonarr4k: # TV shows
    container_name: sonarr4k
    image: lscr.io/linuxserver/sonarr:latest
    hostname: sonarr4k-docker
    restart: always
    networks:
      vpn:
        ipv4_address: ${SONARR4K_STATIC_IP}
    # network_mode: service:vpn # relies on VPN service for network config. De facto 'kill switch'
    logging:
      driver: json-file
    ports:
      - 8990:8989
    environment:
      PUID: ${LOCAL_USER}
      PGID: ${LOCAL_USER}
      TZ: ${TZ}
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      - ${APPDATA_DIR}/sonarr4k:/config
      - ${ARRAY_DIR}/servarr_data/:/data
    depends_on:
      - prowlarr
      - qbittorrent

  seerr: # Discover content
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    networks:
      vpn:
        ipv4_address: ${SEERR_STATIC_IP}
      nginx_network: # For remote access
        ipv4_address: 172.18.0.101 # Static Docker Overseerr IP address on nginx_network
    environment:
      PUID: ${LOCAL_USER}
      PGID: ${LOCAL_USER}
      TZ: ${TZ}
    volumes:
      - ${APPDATA_DIR}/seerr:/app/config
    ports:
      - 5055:5055
    restart: always
    depends_on:
      - prowlarr
      - qbittorrent

  bazarr: # Subtitles
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr:latest
    restart: always
    networks:
      vpn:
        ipv4_address: ${BAZARR_STATIC_IP}
    # network_mode: service:vpn # relies on VPN service for network config. De facto 'kill switch'
    logging:
      driver: json-file
    ports:
      - 6767:6767
    environment:
      PUID: ${LOCAL_USER}
      PGID: ${LOCAL_USER}
      TZ: ${TZ}
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      - ${APPDATA_DIR}/bazarr:/config
      - ${ARRAY_DIR}/servarr_data/media:/data/media
 
  sabnzbd: # Usenet
    container_name: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:latest
    restart: always
    networks:
      vpn:
        ipv4_address: ${SABNZBD_STATIC_IP}
    # network_mode: service:vpn # relies on VPN service for network config. De facto 'kill switch'
    logging:
      driver: json-file
    ports:
      # - 8080:8080
      - 8085:8085 # Defined in vpn service
    environment:
      PUID: ${LOCAL_USER}
      PGID: ${LOCAL_USER}
      TZ: ${TZ}
    volumes:
      # - /etc/localtime:/etc/localtime:ro
      - ${APPDATA_DIR}/sabnzbd:/config
      - ${ARRAY_DIR}/servarr_data/usenet:/data/usenet/
    # depends_on:
    #   - vpn

  # nzbget: # Redundant with Sabnzbd
  #   image: lscr.io/linuxserver/nzbget:latest
  #   container_name: nzbget
  #   network_mode: service:vpn # relies on VPN service for network config. De facto 'kill switch'
  #   environment:
  #     PUID: ${LOCAL_USER}
  #     PGID: ${LOCAL_USER}
  #     TZ: ${TZ}
  #     NZBGET_USER: ${NZBGET_USER} #optional
  #     NZBGET_PASS: ${NZBGET_PASS} #optional
  #   volumes:
